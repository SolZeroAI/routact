name: Tegami PR Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  preview:
    name: Build release preview
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: "0.9.6"
          node-version-file: .node-version
          cache-dependency-path: nub.lock

      - name: Install
        run: nub install --frozen-lockfile

      - name: Build release preview
        run: nub run tegami pr preview --artifact tegami-pr-preview.md

      - name: Upload release preview
        uses: actions/upload-artifact@v7
        with:
          name: tegami-pr-preview
          path: tegami-pr-preview.md
          if-no-files-found: error
          retention-days: 1
