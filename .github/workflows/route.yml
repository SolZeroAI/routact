# Reusable route job. Callers add one job and read its outputs:
#
#   jobs:
#     route:
#       uses: SolZeroAI/routact/.github/workflows/route.yml@master
#       secrets: inherit
#     build:
#       needs: route
#       runs-on: ${{ fromJson(needs.route.outputs.runners)['linux-x64'] }}
#
# With no inputs it reads the org variables ROUTACT_CONFIG and ROUTACT_APP_ID
# and the org secret ROUTACT_APP_PRIVATE_KEY.
name: Route

on:
  workflow_call:
    inputs:
      config:
        description: 'JSON routing rules. Default is the ROUTACT_CONFIG variable.'
        type: string
        required: false
      pools:
        description: 'Comma-separated pool names to route. Default is every pool.'
        type: string
        required: false
      organization:
        description: 'Organization whose runners to check. Default is the one in config, else the repository runners.'
        type: string
        required: false
      claim:
        description: 'Claim a specific idle runner so concurrent runs never share one. Needs runner write access.'
        type: boolean
        default: false
      fallback-on-error:
        description: 'Use the fallback if the runner check fails'
        type: boolean
        default: true
      platform-check:
        type: string
        default: 'error'
      app-id:
        description: 'GitHub App id. Default is the ROUTACT_APP_ID variable.'
        type: string
        required: false
    secrets:
      ROUTACT_APP_PRIVATE_KEY:
        required: false
      ROUTACT_TOKEN:
        description: 'A token to use instead of a GitHub App'
        required: false
      ROUTACT_CHECK_TOKEN:
        description: 'Exposed to "command" checks as the ROUTACT_CHECK_TOKEN environment variable'
        required: false
    outputs:
      runners:
        description: 'JSON object of pool name to label array'
        value: ${{ jobs.route.outputs.runners }}
      use-runner:
        description: 'JSON label array when exactly one pool is routed'
        value: ${{ jobs.route.outputs.use-runner }}
      details:
        value: ${{ jobs.route.outputs.details }}
      claims:
        description: 'Pass to the release input in the job that used the runner'
        value: ${{ jobs.route.outputs.claims }}

jobs:
  route:
    # The smallest, fastest-starting GitHub-hosted runner. Never self-hosted:
    # the router must not depend on the pool it is checking.
    runs-on: ubuntu-slim
    timeout-minutes: 3
    env:
      HAS_APP_KEY: ${{ secrets.ROUTACT_APP_PRIVATE_KEY != '' }}
    outputs:
      runners: ${{ steps.route.outputs.runners }}
      use-runner: ${{ steps.route.outputs.use-runner }}
      details: ${{ steps.route.outputs.details }}
      claims: ${{ steps.route.outputs.claims }}
    steps:
      - name: Create GitHub App token
        id: app-token
        if: env.HAS_APP_KEY == 'true' && (inputs.app-id || vars.ROUTACT_APP_ID) != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app-id || vars.ROUTACT_APP_ID }}
          private-key: ${{ secrets.ROUTACT_APP_PRIVATE_KEY }}
          owner: ${{ inputs.organization || github.repository_owner }}
          permission-organization-self-hosted-runners: ${{ inputs.claim && 'write' || 'read' }}

      - name: Route
        id: route
        uses: SolZeroAI/routact@master
        env:
          ROUTACT_CHECK_TOKEN: ${{ secrets.ROUTACT_CHECK_TOKEN }}
        with:
          vars: ${{ toJSON(vars) }}
          github-token: ${{ steps.app-token.outputs.token || secrets.ROUTACT_TOKEN }}
          config: ${{ inputs.config || vars.ROUTACT_CONFIG }}
          pools: ${{ inputs.pools }}
          organization: ${{ inputs.organization }}
          claim: ${{ inputs.claim }}
          fallback-on-error: ${{ inputs.fallback-on-error }}
          platform-check: ${{ inputs.platform-check }}
